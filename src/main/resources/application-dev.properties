# Desarrollo local: credenciales vía variables de entorno o valores locales no sensibles
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/library_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Datos2026}
spring.datasource.driver-class-name=org.postgresql.Driver

# En dev se actualizan tablas automáticamente y se muestra SQL formateado
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true