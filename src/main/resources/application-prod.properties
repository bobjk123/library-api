# Producción / Entorno estricto: requiere variables de entorno explícitas
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Datos2026}
spring.datasource.driver-class-name=org.postgresql.Driver

# 'validate' verifica que las entidades coincidan con la BD sin alterar tablas ni borrar datos
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Pool de conexiones HikariCP explícito
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-pool-size=2
spring.datasource.hikari.connection-timeout=30000